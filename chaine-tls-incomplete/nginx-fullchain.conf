# nginx for the bench: the internal API www.exemple.test on 443, and the PKI web server on 80.
# The three files differ by one line: the certificate file given to nginx.
worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr;
events {}
http {
  access_log off;
  server {
    listen 443 ssl;
    server_name www.exemple.test;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate     /w/pki/fullchain.pem;
    ssl_certificate_key /w/pki/feuille.key;
    location /api/sante {
      default_type application/json;
      return 200 '{"etat": "ok"}\n';
    }
  }
  server {
    listen 80;
    server_name pki.exemple.test;
    root /w/pki/www-pki;
  }
}
