# Unbound, recursive resolver (container deck-dns-resolveur, 172.30.153.20).
# No trust anchor, so no DNSSEC validation: the test zone is not signed.
# Cache settings are the defaults of Unbound 1.17, written here to be visible:
# no prefetch, no serving of expired records, no minimum TTL.
server:
  interface: 0.0.0.0
  port: 53
  access-control: 172.30.153.0/24 allow
  username: ""
  chroot: ""
  directory: "/etc/unbound"
  pidfile: "/run/unbound.pid"
  module-config: "iterator"
  do-ip6: no
  verbosity: 0
  prefetch: no
  serve-expired: no
  cache-min-ttl: 0
  cache-max-ttl: 86400
  cache-max-negative-ttl: 3600
  # Unbound answers NXDOMAIN for the reserved name test. by default (RFC 6761);
  # this line lifts that default so the stub zone below is used.
  local-zone: "test." nodefault
stub-zone:
  name: "exemple.test"
  stub-addr: 172.30.153.10
