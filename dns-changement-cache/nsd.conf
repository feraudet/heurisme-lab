# NSD, authoritative server for exemple.test (container deck-dns-autorite, 172.30.153.10)
server:
  ip-address: 0.0.0.0
  port: 53
  username: ""
  zonesdir: "/etc/nsd/zones"
  database: ""
  pidfile: "/run/nsd.pid"
  verbosity: 1
remote-control:
  control-enable: yes
  control-interface: /run/nsd.ctl
zone:
  name: "exemple.test"
  zonefile: "exemple.test.zone"
